[package]
name = "gb10_inference"
version = "0.1.0"
edition = "2021"

[dependencies]
# CUDA bindings - required, driver API for sm_121 control
cudarc = { version = "0.9", features = ["driver", "nvrtc", "cublas", "cublaslt", "f16"] }
# Model loading/conversion (optional utility, not inference runtime)
tch = { version = "0.15", optional = true }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Locking (immediate-unwrap guards)
parking_lot = "0.12"
# Serialization
safetensors = "0.8"
anyhow = "1.0"
libc = "0.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
# Math types
half = { version = "2.4", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
# preserve_order: tool definitions are rendered by the chat template's `tojson` filter and the
# reference (transformers/vLLM) preserves the request's key insertion order (Python dicts).
# Without this serde_json sorts keys and our <tools> block diverged from the reference at
# byte 83 on every tool-using turn (RENDER_AUDIT.md 2.1: -345/-1,346 tokens on 12/52 tools).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
bytemuck = "1.14"
# Random generation
rand = "0.8"
# Tokenizer
tokenizers = "0.19"
# Chat template rendering (loads each model's own chat_template.jinja)
# preserve_order: same reason as serde_json above - minijinja's internal ValueMap must keep the
# insertion order of the JSON it was built from, or `tool | tojson` re-sorts the schema keys.
minijinja = { version = "2.21", features = ["preserve_order"] }
# HTTP server
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Content-addressed artifact hashing for --head/--node shard distribution
sha2 = "0.10"
# npz oracle reader (dsv4_load::read_npz_key) — the G3 probe reads oracle pieces directly.
zip = "2.2"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.0"

[features]
default = []
