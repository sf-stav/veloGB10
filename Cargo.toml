[package]
name = "gb10_inference"
version = "0.1.0"
edition = "2021"

[dependencies]
# CUDA bindings - required, driver API for sm_121 control
cudarc = { version = "0.9", features = ["driver", "nvrtc", "cublas", "cublaslt", "f16"] }
# Model loading/conversion (optional utility, not inference runtime)
tch = { version = "0.15", optional = true }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Locking (immediate-unwrap guards)
parking_lot = "0.12"
# Serialization
safetensors = "0.8"
anyhow = "1.0"
libc = "0.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
# Math types
half = { version = "2.4", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
serde_json = "1"
bytemuck = "1.14"
# Random generation
rand = "0.8"
rand_chacha = "0.3"
# Tokenizer
tokenizers = "0.19"
# Chat template rendering (loads each model's own chat_template.jinja)
minijinja = "2.21"
# HTTP server
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Content-addressed artifact hashing for --head/--node shard distribution
sha2 = "0.10"
# Reproducible calibration-corpus source preparation (calib_sources).
blake2 = "0.10"
flate2 = "1.1"
regex = "1.13"
walkdir = "2.5"
ureq = { version = "3.1", features = ["json"] }
url = "2.5"
parquet = { version = "59.2", default-features = false, features = ["json", "snap"] }
# npz oracle reader (dsv4_load::read_npz_key) — the G3 probe reads oracle pieces directly.
zip = "2.2"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.0"

[features]
default = []
